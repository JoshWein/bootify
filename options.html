<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>bootify Options</title>
<link rel="stylesheet" href="bootstrap.min.css">
</head>
<body>
<div class="container py-4">
	<div class="row justify-content-center">
		<div class="col-md-8 text-center">
			<h2>Add your website on a new line</h2>
			<textarea class="form-control mb-3" rows="20" id="websitelist"></textarea>
			<div class="d-flex justify-content-between">
				<button class="btn btn-primary w-25" id="save">Save</button>
				<button class="btn btn-outline-secondary w-25" id="clear">Clear</button>
			</div>
			<div id="status" class="mt-3"></div>
		</div>
	</div>
</div>
<h4 style="position: fixed; bottom: 0; left: 10px;">bootify options</h4>
<script src="options.js"></script>
</body>
</html>
